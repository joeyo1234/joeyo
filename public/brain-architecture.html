<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Systems Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   THEME SYSTEM
   ═══════════════════════════════════════════════════ */
:root {
  --background: hsl(0 0% 100%);
  --foreground: hsl(222.2 47.4% 11.2%);
  --card: hsl(0 0% 100%);
  --card-foreground: hsl(222.2 47.4% 11.2%);
  --muted: hsl(210 40% 96.1%);
  --muted-foreground: hsl(215.4 16.3% 46.9%);
  --border: hsl(214.3 31.8% 91.4%);
  --ring: hsl(215 20.2% 65.1%);
  --surface: hsl(0 0% 98%);
  --surface-2: hsl(210 20% 95%);
  --diagram-bg: hsl(210 20% 97%);
  --diagram-grid-dot: hsl(215 15% 85%);
  --path-inactive: hsl(214.3 20% 85%);
  --module-shadow: hsla(215, 25%, 70%, 0.15);
  --text-primary: hsl(222.2 47.4% 11.2%);
  --text-secondary: hsl(215.4 16.3% 46.9%);
  --text-tertiary: hsl(215 15% 72%);
  --accent-blue: hsl(213 94% 62%);
  --accent-cyan: hsl(162 100% 42%);
  --accent-purple: hsl(256 100% 71%);
  --accent-orange: hsl(24 100% 63%);
  --accent-pink: hsl(340 100% 67%);
  --accent-yellow: hsl(44 100% 60%);
  --accent-red: hsl(350 100% 63%);
  --accent-green: hsl(150 70% 55%);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 9999px;
  --transition-fast: 150ms ease; --transition-base: 250ms ease;
  --transition-slow: 400ms ease; --transition-theme: 300ms ease;
}

[data-theme="dark"] {
  --background: hsl(224 71% 4%);
  --foreground: hsl(213 31% 91%);
  --card: hsl(224 50% 8%);
  --card-foreground: hsl(213 31% 91%);
  --muted: hsl(223 47% 11%);
  --muted-foreground: hsl(215.4 16.3% 56.9%);
  --border: hsl(216 34% 17%);
  --ring: hsl(216 34% 30%);
  --surface: hsl(224 50% 8%);
  --surface-2: hsl(223 47% 12%);
  --diagram-bg: hsl(224 60% 5%);
  --diagram-grid-dot: hsl(216 25% 18%);
  --path-inactive: hsl(216 25% 22%);
  --module-shadow: hsla(224, 50%, 3%, 0.4);
  --text-primary: hsl(213 31% 91%);
  --text-secondary: hsl(215.4 16.3% 56.9%);
  --text-tertiary: hsl(215 15% 30%);
}

/* ═══════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--background);
  color: var(--text-primary);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color var(--transition-theme), color var(--transition-theme);
}

/* ═══════════════════════════════════════════════════
   HEADER — matches joeyo.io main site
   ═══════════════════════════════════════════════════ */
header {
  padding: 0;
  position: relative;
  z-index: 2;
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-6);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.header-text { flex: 1; }

.back-link {
  display: inline-block;
  font-size: 14px;
  color: var(--text-secondary);
  text-decoration: none;
  margin-bottom: var(--space-4);
  transition: color 0.2s ease;
}
.back-link:hover { color: var(--text-primary); }

header h2 {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 500; font-size: 28px;
  color: var(--text-primary); letter-spacing: -0.3px;
  transition: color var(--transition-theme);
  margin-bottom: var(--space-2);
}

.subtitle {
  font-size: 15px; color: var(--text-secondary);
  font-weight: 400; line-height: 1.5;
  max-width: 540px;
}

.theme-toggle {
  padding: 8px;
  border-radius: var(--radius-md);
  background: transparent; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background-color 0.2s ease; flex-shrink: 0;
}
.theme-toggle:hover { background: var(--surface-2); }
.theme-toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.theme-toggle svg { width: 20px; height: 20px; color: var(--text-primary); stroke-width: 1.5; transition: color var(--transition-theme); }
.theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
[data-theme="light"] .theme-toggle .icon-moon { display: block; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

/* ═══════════════════════════════════════════════════
   TASK BAR
   ═══════════════════════════════════════════════════ */
.task-bar {
  display: flex; gap: var(--space-1);
  padding: var(--space-4) var(--space-6);
  flex-wrap: wrap; position: relative; z-index: 2;
  max-width: 960px; margin: 0 auto;
}

.task-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--text-secondary);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 500;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: all var(--transition-fast);
  letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
}
.task-btn:hover { background: var(--muted); color: var(--text-primary); }
.task-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.task-btn.active { background: var(--foreground); color: var(--background); font-weight: 600; }

/* ═══════════════════════════════════════════════════
   DIAGRAM CONTAINER — Tall Pipeline
   ═══════════════════════════════════════════════════ */
.diagram-container {
  position: relative;
  width: 100%; max-width: 900px;
  aspect-ratio: 5 / 7;
  margin: var(--space-2) auto 0;
  padding: 0 var(--space-6);
}

.diagram-inner {
  position: relative;
  width: 100%; height: 100%;
  background: var(--diagram-bg);
  border: 1px solid var(--border);
  /* Organic brain-like silhouette: wider at top (sensory), narrower at bottom (motor) */
  border-radius: 48% 48% 34% 34% / 5% 5% 3% 3%;
  overflow: visible;
  transition: background-color var(--transition-theme), border-color var(--transition-theme);
}

/* Organic texture — subtle cell-like pattern */
.diagram-inner::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse 18px 22px at 30% 25%, color-mix(in srgb, var(--diagram-grid-dot) 40%, transparent) 0%, transparent 70%),
    radial-gradient(ellipse 22px 18px at 70% 45%, color-mix(in srgb, var(--diagram-grid-dot) 30%, transparent) 0%, transparent 70%),
    radial-gradient(ellipse 16px 20px at 50% 70%, color-mix(in srgb, var(--diagram-grid-dot) 35%, transparent) 0%, transparent 70%),
    radial-gradient(var(--diagram-grid-dot) 0.8px, transparent 0.8px);
  background-size: 120px 140px, 140px 120px, 100px 130px, 24px 24px;
  opacity: 0.35; pointer-events: none;
  border-radius: inherit;
  transition: opacity var(--transition-theme);
}

/* ═══════════════════════════════════════════════════
   TIER BANDS
   ═══════════════════════════════════════════════════ */
.tier-band {
  position: absolute; left: 0; right: 0;
  pointer-events: none; z-index: 0;
  border-bottom: 1px dashed var(--border);
  opacity: 0.2;
}
.tier-label {
  position: absolute; left: 3%; top: 8px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 8px; font-weight: 400;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-tertiary); opacity: 0.45;
  font-style: italic;
}

/* Side rail */
.side-rail-border {
  position: absolute;
  right: 30%; top: 16%; bottom: 36%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--border) 20%, var(--border) 80%, transparent);
  pointer-events: none; z-index: 0; opacity: 0.25;
}
.side-rail-label {
  position: absolute;
  right: 31%; top: 15%;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 7px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-tertiary); opacity: 0.3;
  writing-mode: vertical-rl; text-orientation: mixed;
  font-style: italic;
}

/* Flow chevrons — soft organic arrows */
.flow-chevron {
  position: absolute; left: 37%;
  pointer-events: none; z-index: 0; opacity: 0.08;
  transition: opacity var(--transition-slow);
  color: var(--text-tertiary);
  font-size: 18px;
  font-family: system-ui;
  user-select: none;
  letter-spacing: -2px;
}
.has-active-task .flow-chevron { opacity: 0; }

/* ═══════════════════════════════════════════════════
   SVG + CANVAS LAYERS
   ═══════════════════════════════════════════════════ */
.connections-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}
.connections-layer path {
  fill: none;
  stroke: var(--path-inactive);
  stroke-width: 1; opacity: 0.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: all 0.5s ease;
}
.connections-layer path.active {
  stroke-width: 2.5; opacity: 0.85;
}
.connections-layer path.feedback-path {
  stroke-dasharray: 5 4;
}
.connections-layer path.active.feedback-path {
  stroke-dasharray: 5 4;
}

.particle-canvas {
  position: absolute; inset: 0;
  z-index: 3; pointer-events: none;
}

/* ═══════════════════════════════════════════════════
   MODULE NODES
   ═══════════════════════════════════════════════════ */
/* ── Module: compact by default, organic feel ── */
.module {
  position: absolute;
  background: color-mix(in srgb, var(--card) 92%, var(--module-color));
  border: 1px solid color-mix(in srgb, var(--border) 80%, var(--module-color) 20%);
  border-radius: 14px;
  padding: 8px 12px;
  padding-left: 16px;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 4;
  width: clamp(105px, 11vw, 140px);
  transform: translate(-50%, -50%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.module-indicator {
  position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--module-color);
  opacity: 0.25; transition: opacity var(--transition-base);
}

/* Intake port (top) — organic rounded */
.module::before {
  content: ''; position: absolute;
  top: -4px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 4px;
  background: var(--module-color);
  border-radius: 4px 4px 0 0;
  opacity: 0; transition: opacity var(--transition-base);
}
/* Output port (bottom) — organic rounded */
.module::after {
  content: ''; position: absolute;
  bottom: -4px; left: 50%; transform: translateX(-50%);
  width: 12px; height: 4px;
  background: var(--module-color);
  border-radius: 0 0 4px 4px;
  opacity: 0; transition: opacity var(--transition-base);
}

.module .tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px; font-weight: 500;
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 1px; color: var(--text-tertiary);
  transition: color var(--transition-slow);
}
.module .name {
  font-weight: 600; font-size: 12px;
  color: var(--text-primary);
  transition: color var(--transition-slow); line-height: 1.25;
}
.module .region {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 7px; font-weight: 400;
  color: var(--text-tertiary); letter-spacing: 0.2px;
  margin-top: 2px; line-height: 1.3;
  max-height: 0; overflow: hidden; opacity: 0;
  transition: all 0.35s ease;
}
.module .desc {
  font-size: 10px; color: var(--text-secondary);
  margin-top: var(--space-1); line-height: 1.5;
  max-height: 0; overflow: hidden;
  transition: max-height 0.5s ease, opacity var(--transition-slow);
  opacity: 0;
}
.module .seq {
  position: absolute; top: -8px; right: -8px;
  width: 20px; height: 20px;
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  opacity: 0; transform: scale(0);
  transition: all var(--transition-base);
  background: var(--module-color); color: white;
}

/* ── Hover state: gentle grow + reveal region ── */
.module:hover {
  transform: translate(-50%, -50%) scale(1.06);
  box-shadow: 0 6px 20px var(--module-shadow);
  border-color: color-mix(in srgb, var(--module-color) 35%, var(--border));
  z-index: 5;
}
.module:hover .module-indicator { opacity: 0.5; }
.module:hover .region { max-height: 30px; opacity: 1; }

.module:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ── Expanded state: click to expand, shows full description ── */
.module.expanded {
  width: clamp(150px, 16vw, 200px);
  transform: translate(-50%, -50%) scale(1.08);
  z-index: 10;
  border-color: color-mix(in srgb, var(--module-color) 50%, transparent);
  background: color-mix(in srgb, var(--module-color) 5%, var(--card));
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--module-color) 12%, transparent),
    0 8px 32px color-mix(in srgb, var(--module-color) 15%, transparent);
  border-radius: 16px;
  padding: 10px 14px 12px 18px;
}
.module.expanded .module-indicator { opacity: 0.8; }
.module.expanded .tag { color: var(--module-color); }
.module.expanded .region { max-height: 40px; opacity: 1; color: var(--text-secondary); }
.module.expanded .desc { max-height: 150px; opacity: 1; }

/* ── Active state (task selected): glow + ports, but stays compact ── */
.module.active {
  border-color: color-mix(in srgb, var(--module-color) 50%, transparent);
  background: color-mix(in srgb, var(--module-color) 8%, var(--card));
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--module-color) 15%, transparent),
    0 4px 20px color-mix(in srgb, var(--module-color) 12%, transparent);
  animation: pulse 3s ease-in-out infinite;
}
.module.active .module-indicator { opacity: 1; }
.module.active .tag { color: var(--module-color); }
.module.active .region { max-height: 30px; opacity: 1; color: var(--text-secondary); }
.module.active .seq { opacity: 1; transform: scale(1); }
.module.active::before, .module.active::after { opacity: 0.5; }

/* Active + expanded = full detail */
.module.active.expanded .desc { max-height: 150px; opacity: 1; }

/* ── Dimmed state ── */
.module.dimmed {
  opacity: 0.12; transform: translate(-50%, -50%) scale(0.94);
  filter: grayscale(0.5);
}
.module.dimmed:hover {
  transform: translate(-50%, -50%) scale(0.94);
  box-shadow: none;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--module-color) 15%, transparent), 0 4px 20px color-mix(in srgb, var(--module-color) 12%, transparent); }
  50% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--module-color) 22%, transparent), 0 4px 28px color-mix(in srgb, var(--module-color) 18%, transparent); }
}

/* ═══════════════════════════════════════════════════
   INFO PANEL
   ═══════════════════════════════════════════════════ */
.info-panel {
  position: relative; z-index: 2;
  max-width: 900px; margin: 0 auto;
  padding: var(--space-4) var(--space-6) var(--space-10);
}
.info-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6) var(--space-8);
  opacity: 0; transform: translateY(8px);
  transition: all var(--transition-slow);
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-8);
}
.info-card.visible { opacity: 1; transform: translateY(0); }

.info-flow h3 {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 600; font-size: 10px;
  color: var(--accent-blue);
  margin-bottom: var(--space-1);
  letter-spacing: 2px; text-transform: uppercase;
}
.info-flow .task-title {
  font-size: 20px; font-weight: 600;
  margin-bottom: var(--space-3);
  color: var(--text-primary); line-height: 1.3;
}
.info-flow .flow-desc {
  font-size: 13px; line-height: 1.75; color: var(--text-secondary);
}
.info-flow .flow-desc strong { color: var(--text-primary); font-weight: 600; }

.info-bridges h4 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  color: var(--accent-orange);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: var(--space-3);
}
.bridge-item {
  background: var(--muted); border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-2);
  transition: background-color var(--transition-theme);
}
.bridge-item .bridge-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 600;
  color: var(--text-primary); margin-bottom: 2px;
  display: flex; align-items: center; gap: var(--space-2);
}
.bridge-item .bridge-label::before {
  content: ''; display: inline-block;
  width: 6px; height: 6px;
  border-radius: var(--radius-full);
  background: var(--accent-cyan); flex-shrink: 0;
}
.bridge-item .bridge-desc {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.5; padding-left: 14px;
}

/* Region detail view in info card */
.info-region-header {
  display: flex; align-items: center; gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.info-region-dot {
  width: 12px; height: 12px; border-radius: var(--radius-full);
  flex-shrink: 0;
  box-shadow: 0 0 8px var(--dot-color);
}
.info-region-title {
  font-size: 20px; font-weight: 600;
  color: var(--text-primary); line-height: 1.3;
}
.info-region-anatomy {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--text-secondary);
  margin-bottom: var(--space-4); line-height: 1.5;
}
.info-region-desc {
  font-size: 13px; line-height: 1.75; color: var(--text-secondary);
}
.info-region-desc strong { color: var(--text-primary); font-weight: 600; }
.info-clinical h4 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  color: var(--accent-red); letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: var(--space-3);
}
.info-tasks-used h4 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  color: var(--accent-cyan); letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: var(--space-2);
}
.info-tasks-used .task-tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 500;
  padding: 3px 8px; margin: 2px 4px 2px 0;
  border-radius: var(--radius-sm);
  background: var(--muted); color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition-fast);
}
.task-tag:hover { background: var(--foreground); color: var(--background); }

/* ═══════════════════════════════════════════════════
   BRAIN ANATOMY SVG
   ═══════════════════════════════════════════════════ */
.brain-panel {
  position: relative; z-index: 2;
  max-width: 900px; margin: 0 auto;
  padding: var(--space-4) var(--space-6) 0;
}
.brain-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-6);
  transition: background-color var(--transition-theme), border-color var(--transition-theme);
  display: flex;
  align-items: center;
  gap: var(--space-6);
}
.brain-svg-wrap {
  flex: 0 0 55%;
  max-width: 420px;
  position: relative;
}
.brain-svg-wrap svg { width: 100%; height: auto; position: relative; z-index: 1; }
.brain-particle-canvas {
  position: absolute; inset: 0; z-index: 2;
  pointer-events: none; border-radius: var(--radius-sm);
}
.brain-legend {
  flex: 1;
}
.brain-legend h3 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: var(--space-3);
}
.brain-legend-item {
  display: flex; align-items: center; gap: var(--space-2);
  margin-bottom: 4px; padding: 4px 8px;
  font-size: 11px; color: var(--text-secondary);
  transition: all 0.2s ease; cursor: pointer;
  border-radius: var(--radius-sm);
}
.brain-legend-item:hover {
  background: var(--muted); color: var(--text-primary);
}
.brain-legend-item .legend-dot {
  width: 8px; height: 8px; border-radius: var(--radius-full);
  flex-shrink: 0; transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.brain-legend-item.active {
  color: var(--text-primary); background: var(--muted);
  font-weight: 500;
}
.brain-legend-item.active .legend-dot {
  transform: scale(1.4);
  box-shadow: 0 0 8px currentColor;
}
/* Brain region paths */
.brain-region {
  transition: fill 0.5s ease, opacity 0.5s ease, filter 0.5s ease;
  cursor: pointer;
}
.brain-region:hover { filter: brightness(1.2); }
.brain-region.region-lit {
  filter: brightness(1.3) drop-shadow(0 0 6px var(--region-color));
}
.brain-outline {
  fill: none;
  stroke: var(--text-tertiary);
  stroke-width: 1.2;
  opacity: 0.4;

}
.brain-sulcus {

  opacity: 0.2;
  stroke-linecap: round;
}
.brain-label-text {

  pointer-events: none;
  transition: opacity 0.3s ease;
}
.brain-region.region-lit + .brain-label-text,
.brain-region:hover + .brain-label-text {
  opacity: 0.9;
}
/* White matter flow paths */
.brain-flow-path {
  transition: opacity 0.5s ease, stroke-width 0.5s ease, filter 0.5s ease;
}
.brain-flow-path.flow-lit {
  opacity: 0.85 !important;
  stroke-width: 3 !important;

  stroke-dasharray: 8 4;
  animation: brainFlowDash 0.8s linear infinite;

  to { stroke-dashoffset: -12; }
}

<script>
// ══════════════════════════════════════════════════
// THEME
// ══════════════════════════════════════════════════
// Theme: read from localStorage (synced by parent Next.js page via MutationObserver)
(function initTheme() {
  const stored = localStorage.getItem('theme');
  document.documentElement.setAttribute('data-theme', stored || 'dark');
})();

// ══════════════════════════════════════════════════
// MODULE DEFINITIONS — Tier-based vertical layout
// ══════════════════════════════════════════════════
// x/y are percentages; modules use transform:translate(-50%,-50%) so these are CENTER points
const modules = {
  // TIER 1 — SENSORY INPUT (y ~6%)
  visual:       { id: 'visual',       name: 'Visual Processing',   tag: 'Perceptual',  x: 22, y: 6,  color: '#4a9eff',
    region: 'V1\u2013V5, occipital lobe, fusiform gyrus (VWFA)',
    desc: 'Retinal input \u2192 edge detection \u2192 pattern recognition \u2192 object identification. The Visual Word Form Area (left fusiform) specializes in letter/word recognition.' },
  auditory:     { id: 'auditory',     name: 'Auditory Processing',  tag: 'Perceptual',  x: 50, y: 6,  color: '#00d4aa',
    region: 'A1, superior temporal gyrus, Heschl\u2019s gyrus',
    desc: 'Cochlear input \u2192 spectrotemporal analysis \u2192 pitch, timing, loudness extraction. Segments the continuous acoustic stream into processable units.' },
  // TIER 2 — EARLY PROCESSING (y ~22%)
  spatial:      { id: 'spatial',      name: 'Spatial Reasoning',    tag: 'Reasoning',   x: 18, y: 22, color: '#ffcc33',
    region: 'Posterior parietal cortex, intraparietal sulcus',
    desc: 'Mental rotation, magnitude processing, number line representation. The intraparietal sulcus is critical for numerical magnitude (Dehaene\u2019s triple-code model).' },
  phonological: { id: 'phonological', name: 'Phonological System',  tag: 'Language',    x: 48, y: 22, color: '#9b6dff',
    region: 'Posterior STG, supramarginal gyrus (L)',
    desc: 'Encodes sound-based representations of language. Contains Baddeley\u2019s phonological loop \u2014 a short-term buffer for speech sounds with articulatory rehearsal.' },
  // TIER 3 — DEEP PROCESSING (y ~40%)
  semantic:     { id: 'semantic',     name: 'Semantic Network',     tag: 'Language',    x: 22, y: 40, color: '#ff8844',
    region: 'Anterior temporal lobe, angular gyrus',
    desc: 'Hub-and-spoke concept system (Patterson & Lambon Ralph). The anterior temporal lobe integrates modality-specific features into amodal meanings, categories, and associations.' },
  syntactic:    { id: 'syntactic',    name: 'Syntactic Engine',     tag: 'Language',    x: 50, y: 40, color: '#ff5599',
    region: 'Broca\u2019s area (BA 44/45), left IFG',
    desc: 'Computes hierarchical phrase structure for both comprehension (parsing) and production (grammatical encoding). Operates via Levelt\u2019s formulator model.' },
  // TIER 4 — INTEGRATION HUB (y ~58%)
  workingmem:   { id: 'workingmem',   name: 'Working Memory',      tag: 'Integration', x: 27, y: 58, color: '#4a9eff',
    region: 'Dorsolateral PFC (BA 9/46), posterior parietal',
    desc: 'Baddeley\u2019s model: central executive + phonological loop + visuospatial sketchpad + episodic buffer. Capacity-limited (~4 chunks). The critical integration bottleneck.' },
  executive:    { id: 'executive',    name: 'Executive Control',    tag: 'Governance',  x: 52, y: 58, color: '#ff4466',
    region: 'Anterior PFC, anterior cingulate cortex (ACC)',
    desc: 'Conflict monitoring (ACC), inhibition, task switching, goal maintenance. Norman & Shallice\u2019s supervisory attentional system. Slow, effortful, fatigable.' },
  // TIER 5 — OUTPUT (y ~78%)
  motor:        { id: 'motor',        name: 'Motor Output',         tag: 'Output',      x: 38, y: 78, color: '#44dd88',
    region: 'Primary motor cortex (M1), premotor, SMA, cerebellum',
    desc: 'Executes voluntary movement \u2014 speech articulation (ventral premotor), handwriting (dorsal stream), typing. Tightly coupled to sensory systems via feedback loops.' },
  // SIDE RAIL — MODULATION (x ~78%)
  emotional:    { id: 'emotional',    name: 'Emotional System',     tag: 'Modulation',  x: 80, y: 25, color: '#ff5599',
    region: 'Amygdala, OFC, insula, ventral striatum',
    desc: 'Evaluates affective significance and valence. Amygdala-driven salience detection, reward processing (ventral striatum), interoception (insula). Modulates all other systems.' },
  memory:       { id: 'memory',       name: 'Long-term Memory',     tag: 'Storage',     x: 80, y: 50, color: '#9b6dff',
    region: 'Hippocampus, entorhinal cortex, neocortical stores',
    desc: 'Hippocampus binds cortical representations into episodic memories. Systems consolidation transfers to neocortex over time. Also semantic (facts) and procedural (skills) subsystems.' },
};

// ══════════════════════════════════════════════════
// CONNECTIONS
// ══════════════════════════════════════════════════
const connections = [
  // Sensory → Early Processing
  ['visual', 'phonological'], ['visual', 'spatial'], ['visual', 'semantic'], ['visual', 'workingmem'],
  ['visual', 'emotional'],    // fast threat detection (superior colliculus → pulvinar → amygdala)
  ['auditory', 'phonological'], ['auditory', 'workingmem'],
  ['auditory', 'semantic'],   // non-speech sound meaning (ventral stream)
  ['auditory', 'emotional'],  // startle, music emotion (medial geniculate → amygdala)
  // Early Processing → Deep Processing
  ['phonological', 'semantic'], ['phonological', 'syntactic'], ['phonological', 'workingmem'],
  ['phonological', 'motor'],  // articulatory planning
  ['spatial', 'workingmem'], ['spatial', 'motor'],
  ['spatial', 'semantic'],    // spatial language, number-space mapping (angular gyrus)
  // Deep Processing interconnections
  ['semantic', 'syntactic'], ['semantic', 'workingmem'], ['semantic', 'emotional'],
  ['syntactic', 'workingmem'], ['syntactic', 'phonological'],  // output phonological encoding
  // Integration hub
  ['workingmem', 'executive'], ['workingmem', 'motor'], ['workingmem', 'memory'],
  ['workingmem', 'syntactic'],  // grammatical encoding during production
  ['executive', 'motor'], ['executive', 'workingmem'],
  ['executive', 'semantic'],  // top-down revision/retrieval
  ['executive', 'emotional'], // top-down emotion regulation (PFC → amygdala)
  // Modulation
  ['emotional', 'executive'], ['emotional', 'memory'], ['emotional', 'workingmem'],
  ['emotional', 'motor'],     // expressive behavior, fight/flight (OFC → premotor)
  // Feedback loops
  ['memory', 'semantic'], ['memory', 'workingmem'],
  ['memory', 'emotional'],    // memory-triggered emotion (hippocampus → amygdala)
  // Sensory feedback loops (motor output → perception)
  ['motor', 'visual'],    // seeing what you wrote
  ['motor', 'auditory'],  // hearing your own speech
];

// Feedback paths — flow AGAINST the main top-to-bottom direction
const feedbackPaths = new Set([
  'memory->semantic', 'memory->workingmem', 'memory->emotional',
  'executive->workingmem', 'executive->semantic', 'executive->emotional',
  'syntactic->phonological', 'motor->visual', 'motor->auditory',
  'workingmem->syntactic', 'emotional->workingmem', 'emotional->motor'
]);

// ══════════════════════════════════════════════════
// TASKS
// ══════════════════════════════════════════════════
const tasks = {
  reading: {
    name: 'Reading',

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function colorAlpha(hex, a) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

const taskBar = document.getElementById('taskBar');
const taskKeys = Object.keys(tasks);
taskKeys.forEach((key, i) => {
  const task = tasks[key];
  const btn = document.createElement('button');
  btn.className = 'task-btn';
  btn.textContent = task.name;
  btn.dataset.task = key;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', 'false');
  btn.setAttribute('tabindex', i === 0 ? '0' : '-1');
  btn.addEventListener('click', () => activateTask(key));
  taskBar.appendChild(btn);
});

taskBar.addEventListener('keydown', (e) => {
  const btns = [...taskBar.querySelectorAll('.task-btn')];
  const cur = btns.findIndex(b => b === document.activeElement);
  if (cur === -1) return;
  let next = -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % btns.length;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (cur - 1 + btns.length) % btns.length;
  else if (e.key === 'Escape') { deactivateAll(); return; }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btns[cur].click(); return; }
  else return;
  e.preventDefault();
  btns[cur].setAttribute('tabindex', '-1');
  btns[next].setAttribute('tabindex', '0');
  btns[next].focus();
});

Object.entries(modules).forEach(([key, mod]) => {
  const el = document.createElement('div');
  el.className = 'module';
  el.id = `mod-${key}`;
  el.style.left = mod.x + '%';
  el.style.top = mod.y + '%';
  el.style.setProperty('--module-color', mod.color);
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${mod.name} module \u2014 ${mod.tag}`);
  el.innerHTML = `
    <div class="module-indicator"></div>
    <div class="seq"></div>
    <div class="tag">${mod.tag}</div>
    <div class="name">${mod.name}</div>
    <div class="region">${mod.region}</div>
    <div class="desc">${mod.desc}</div>
  `;
  el.addEventListener('mouseenter', () => {
    if (!activeTask) {
      highlightModuleConnections(key, true);
      updateBrainHighlights([key]);
    }
  });
  el.addEventListener('mouseleave', () => {
    if (!activeTask) {
      highlightModuleConnections(key, false);
      updateBrainHighlights([]);
    }
  });
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!activeTask) {
      // No task active → select this brain region and expand the module
      selectBrainRegion(key, 'module');
      return;
    }
    // Task is active → toggle expand for detail
    const wasExpanded = el.classList.contains('expanded');
    document.querySelectorAll('.module.expanded').forEach(m => m.classList.remove('expanded'));
    if (!wasExpanded) {
      el.classList.add('expanded');
    }
    setTimeout(drawConnections, 50);
  });
  diagram.appendChild(el);
});

    document.querySelectorAll('.module.expanded').forEach(m => m.classList.remove('expanded'));

});

  const cr = diagram.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 };
}

function isSideRail(id) { return id === 'emotional' || id === 'memory'; }

function buildPathD(fromId, toId) {
  const a = getModuleCenter(fromId);
  const b = getModuleCenter(toId);
  const dx = b.x - a.x;
  const dy = b.y - a.y;

  // Side rail connections: gentle S-curve
  if (isSideRail(fromId) || isSideRail(toId)) {
    const cp1x = a.x + dx * 0.3;
    const cp1y = a.y + dy * 0.1;
    const cp2x = a.x + dx * 0.7;
    const cp2y = b.y - dy * 0.1;
    return `M${a.x},${a.y} C${cp1x},${cp1y} ${cp2x},${cp2y} ${b.x},${b.y}`;
  }

  // Primarily vertical paths (between tiers)
  if (Math.abs(dy) > Math.abs(dx) * 0.4) {
    const cp1x = a.x + dx * 0.15;
    const cp1y = a.y + dy * 0.45;
    const cp2x = b.x - dx * 0.15;
    const cp2y = b.y - dy * 0.45;
    return `M${a.x},${a.y} C${cp1x},${cp1y} ${cp2x},${cp2y} ${b.x},${b.y}`;
  }

  // Same-tier horizontal: gentle arc
  const mx = (a.x + b.x) / 2;
  const offset = Math.abs(dy) * 0.3 + 15;
  return `M${a.x},${a.y} Q${mx},${(a.y + b.y) / 2 - offset} ${b.x},${b.y}`;
}

function drawConnections() {
  const svg = document.getElementById('connections');
  const cr = diagram.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${cr.width} ${cr.height}`);
  svg.innerHTML = '';
  pathMap.clear();

  // Arrowhead defs
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const usedColors = new Set();
  Object.values(modules).forEach(m => usedColors.add(m.color));
  usedColors.forEach(color => {
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    const cid = color.replace('#', '');
    marker.setAttribute('id', `arrow-${cid}`);
    marker.setAttribute('viewBox', '0 0 8 6');
    marker.setAttribute('refX', '7');
    marker.setAttribute('refY', '3');
    marker.setAttribute('markerWidth', '8');
    marker.setAttribute('markerHeight', '6');
    marker.setAttribute('orient', 'auto-start-reverse');
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', '0,0 8,3 0,6');
    poly.setAttribute('fill', color);
    marker.appendChild(poly);
    defs.appendChild(marker);
  });
  svg.appendChild(defs);

  connections.forEach(([from, to]) => {
    const d = buildPathD(from, to);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.dataset.from = from;
    path.dataset.to = to;
    if (feedbackPaths.has(`${from}->${to}`)) {
      path.classList.add('feedback-path');
    }
    svg.appendChild(path);
    pathMap.set(`${from}->${to}`, path);
  });
}

function highlightModuleConnections(moduleId, active) {
  document.querySelectorAll('#connections path').forEach(path => {
    if (path.dataset.from === moduleId || path.dataset.to === moduleId) {
      if (active) {
        path.style.stroke = modules[moduleId].color;
        path.style.opacity = '0.6';
        path.style.strokeWidth = '1.5';
      } else {
        path.style.stroke = '';
        path.style.opacity = '';
        path.style.strokeWidth = '';
      }
    }
  });
}

setTimeout(drawConnections, 120);
window.addEventListener('resize', () => {
  clearTimeout(window._rt);
  window._rt = setTimeout(() => {
    drawConnections();
    resizeCanvas();
    if (activeTask) presampleActivePaths();
  }, 150);
});

// ══════════════════════════════════════════════════
// PARTICLE SYSTEM
// ══════════════════════════════════════════════════
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let emitters = [];
let particleRunning = false;
let lastFrame = 0;
const MAX_PARTICLES = 45;

// Pre-sampled path data for performance
const sampledPaths = new Map(); // key => { points: [{x,y}...], length }

function resizeCanvas() {
  const rect = diagram.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();

function presamplePath(pathEl, key) {
  const len = pathEl.getTotalLength();
  const numSamples = 80;
  const points = [];
  for (let i = 0; i <= numSamples; i++) {
    const p = pathEl.getPointAtLength((i / numSamples) * len);
    points.push({ x: p.x, y: p.y });
  }
  sampledPaths.set(key, { points, length: len });
}

function presampleActivePaths() {
  sampledPaths.clear();
  if (!activeTask) return;
  const task = tasks[activeTask];
  task.activePaths.forEach(([from, to]) => {
    const key = `${from}->${to}`;
    const pathEl = pathMap.get(key) || pathMap.get(`${to}->${from}`);
    if (pathEl) presamplePath(pathEl, key);
  });
}

function getPointOnSampled(key, progress) {
  const data = sampledPaths.get(key);
  if (!data) return null;
  const t = Math.max(0, Math.min(1, progress / data.length));
  const idx = t * (data.points.length - 1);
  const i = Math.floor(idx);
  const frac = idx - i;
  const p0 = data.points[Math.min(i, data.points.length - 1)];
  const p1 = data.points[Math.min(i + 1, data.points.length - 1)];
  return { x: p0.x + (p1.x - p0.x) * frac, y: p0.y + (p1.y - p0.y) * frac };
}

function createParticle(pathKey, color, reverse) {
  const data = sampledPaths.get(pathKey);
  if (!data) return null;
  return {
    pathKey,
    color,
    progress: reverse ? data.length : 0,
    speed: (1.2 + Math.random() * 0.8) * (reverse ? -1 : 1),
    radius: 2.5 + Math.random() * 1.5,
    alive: true,
    trail: [],
    trailMax: 6,
    length: data.length,
    reverse
  };
}

function particleLoop(ts) {
  if (!particleRunning) return;
  const dt = Math.min(ts - lastFrame, 33);
  lastFrame = ts;

  ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));

  // Update emitters
  for (const em of emitters) {
    em.elapsed += dt;
    if (em.elapsed < em.delay) continue;
    em.timeSinceLast += dt;
    const interval = 1000 / em.rate;
    while (em.timeSinceLast >= interval && particles.length < MAX_PARTICLES) {
      const p = createParticle(em.pathKey, em.color, em.reverse);
      if (p) particles.push(p);
      em.timeSinceLast -= interval;
    }
  }

  // Update + render particles
  for (const p of particles) {
    p.progress += p.speed * (dt / 16.67);
    const pt = getPointOnSampled(p.pathKey, p.progress);
    if (!pt) { p.alive = false; continue; }

    p.trail.push({ x: pt.x, y: pt.y });
    if (p.trail.length > p.trailMax) p.trail.shift();

    if (!p.reverse && p.progress >= p.length) p.alive = false;
    if (p.reverse && p.progress <= 0) p.alive = false;

    // Draw trail
    for (let i = 0; i < p.trail.length - 1; i++) {
      const alpha = (i / p.trail.length) * 0.25;
      ctx.beginPath();
      ctx.arc(p.trail[i].x, p.trail[i].y, p.radius * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = colorAlpha(p.color, alpha);
      ctx.fill();
    }

    // Glow
    const head = p.trail[p.trail.length - 1];
    if (head) {
      ctx.beginPath();
      ctx.arc(head.x, head.y, p.radius + 3, 0, Math.PI * 2);
      ctx.fillStyle = colorAlpha(p.color, 0.12);
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(head.x, head.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = colorAlpha(p.color, 0.85);
      ctx.fill();
    }
  }

  particles = particles.filter(p => p.alive);
  requestAnimationFrame(particleLoop);
}

function startParticles() {
  if (prefersReducedMotion) return;
  particleRunning = true;
  lastFrame = performance.now();
  requestAnimationFrame(particleLoop);
}

function stopParticles() {
  particleRunning = false;
  particles = [];
  emitters = [];
  sampledPaths.clear();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Pause when tab hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden && particleRunning) {
    particleRunning = false;
  } else if (!document.hidden && activeTask) {
    particleRunning = true;
    lastFrame = performance.now();
    requestAnimationFrame(particleLoop);
  }
});

// ══════════════════════════════════════════════════
// TASK ACTIVATION — CASCADE
// ══════════════════════════════════════════════════
let activeTask = null;
let selectedBrainRegion = null;
let cascadeTimers = [];

function activateTask(taskKey) {
  if (activeTask === taskKey) { deactivateAll(); return; }
  deactivateAll();
  setTimeout(() => applyCascade(taskKey), 60);
}

function applyCascade(taskKey) {
  activeTask = taskKey;
  const task = tasks[taskKey];
  diagram.classList.add('has-active-task');

  // Update buttons
  document.querySelectorAll('.task-btn').forEach(btn => {
    const isActive = btn.dataset.task === taskKey;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  // Dim non-active modules immediately
  Object.keys(modules).forEach(key => {
    const el = document.getElementById(`mod-${key}`);
    if (!task.activeModules.includes(key)) {
      el.classList.add('dimmed');
    }
  });

  // Sort modules by sequence
  const sequenced = Object.entries(task.sequence).sort(([, a], [, b]) => a - b);
  const cascadeDelay = 350;

  // Pre-sample paths and init particles
  presampleActivePaths();
  resizeCanvas();
  emitters = [];
  startParticles();

  // Cascade: activate modules one by one
  sequenced.forEach(([modKey, seqNum], index) => {
    const timer = setTimeout(() => {
      const el = document.getElementById(`mod-${modKey}`);
      el.classList.add('active');
      el.querySelector('.seq').textContent = seqNum;

      // Activate paths FROM this module and start emitters
      task.activePaths.forEach(([from, to]) => {
        if (from === modKey || to === modKey) {
          const key = `${from}->${to}`;
          const pathEl = pathMap.get(key) || pathMap.get(`${to}->${from}`);
          if (pathEl && !pathEl.classList.contains('active')) {
            pathEl.classList.add('active');
            const sourceColor = modules[from].color;
            const cid = sourceColor.replace('#', '');
            pathEl.style.stroke = sourceColor;
            pathEl.style.filter = `drop-shadow(0 0 3px ${colorAlpha(sourceColor, 0.3)})`;

            const isFeedback = feedbackPaths.has(key);

            if (!isFeedback) {
              pathEl.setAttribute('marker-end', `url(#arrow-${cid})`);
            }

            // Create emitter
            if (sampledPaths.has(key)) {
              emitters.push({
                pathKey: key,
                color: sourceColor,
                rate: isFeedback ? 1.2 : 2,
                reverse: isFeedback,
                delay: index * cascadeDelay + 100,
                elapsed: 0,
                timeSinceLast: 1000 // emit immediately after delay
              });
            }
          }
        }
      });
    }, index * cascadeDelay);
    cascadeTimers.push(timer);
  });

  // Info panel — show after cascade begins
  const infoTimer = setTimeout(() => {
    const card = document.getElementById('infoCard');
    card.innerHTML = `
      <div class="info-flow">
        <h3>Information Flow</h3>
        <div class="task-title">${task.title}</div>
        <div class="flow-desc">${task.desc}</div>
      </div>
      <div class="info-bridges">
        <h4>Critical Bridges</h4>
        ${task.bridges.map(b => `
          <div class="bridge-item">
            <div class="bridge-label">${b.label}</div>
            <div class="bridge-desc">${b.desc}</div>
          </div>
        `).join('')}
      </div>
    `;
    card.classList.remove('visible');
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
  }, sequenced.length * cascadeDelay * 0.4);
  cascadeTimers.push(infoTimer);
}

function deactivateAll() {
  activeTask = null;
  selectedBrainRegion = null;
  cascadeTimers.forEach(t => clearTimeout(t));
  cascadeTimers = [];
  diagram.classList.remove('has-active-task');
  document.querySelectorAll('.module.expanded').forEach(m => m.classList.remove('expanded'));
  stopParticles();

  document.querySelectorAll('.task-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.module').forEach(m => {
    m.classList.remove('active', 'dimmed');
    m.style.transitionDelay = '0s';
    m.querySelector('.seq').textContent = '';
  });
  document.querySelectorAll('#connections path').forEach(p => {
    p.classList.remove('active');
    p.style.stroke = '';
    p.style.filter = '';
    p.removeAttribute('marker-end');
  });
  document.getElementById('infoCard').classList.remove('visible');
  stopBrainParticles();
  updateBrainHighlights([]);
}

    clinical: 'Amygdala damage eliminates fear responses (Urbach-Wiethe disease). Insula damage impairs recognition of disgust and pain empathy. Dysfunctional amygdala-PFC circuits underlie anxiety disorders, PTSD, and emotional dysregulation. Reward circuit dysfunction is central to addiction and depression.',

  },
  memory: {
    title: 'Hippocampal Formation',

// ── Shared function: select a brain region by module ID ──
function selectBrainRegion(modId, source) {
  // source: 'module' = clicked from flow diagram, 'brain'/'legend' = clicked from brain area or legend
  if (selectedBrainRegion === modId) {
    clearBrainRegionSelection();
    return;
  }
  if (activeTask) deactivateAll();
  selectedBrainRegion = modId;

  updateBrainHighlights([modId]);
  const modEl = document.getElementById(`mod-${modId}`);
  if (modEl) {
    document.querySelectorAll('.module').forEach(m => {
      m.classList.remove('active', 'expanded');
      if (m.id !== `mod-${modId}`) m.classList.add('dimmed');
      else m.classList.remove('dimmed');
    });
    modEl.classList.add('active');
    // If clicked from the flow diagram module, expand it to show description
    if (source === 'module') {
      modEl.classList.add('expanded');
    }
  }
  highlightModuleConnections(modId, true);

  // Update legend active state
  document.querySelectorAll('.brain-legend-item').forEach(item => {
    item.classList.toggle('active', item.dataset.module === modId);
  });

  showBrainRegionDetail(modId);
}

// Brain SVG region click + hover
document.querySelectorAll('.brain-region').forEach(region => {
  const modId = region.dataset.modules;

  region.addEventListener('click', (e) => {
    e.stopPropagation();
    selectBrainRegion(modId);
  });

  region.addEventListener('mouseenter', () => {
    if (!activeTask && !selectedBrainRegion) {
      updateBrainHighlights([modId]);
      highlightModuleConnections(modId, true);
    }
  });
  region.addEventListener('mouseleave', () => {
    if (!activeTask && !selectedBrainRegion) {
      updateBrainHighlights([]);
      highlightModuleConnections(modId, false);
    } else if (activeTask) {
      updateBrainHighlights(tasks[activeTask].activeModules);
    }
  });
});

function showBrainRegionDetail(modId) {
  const detail = brainRegionDetails[modId];
  const mod = modules[modId];
  if (!detail || !mod) return;

  // Find which tasks use this module
  const tasksUsing = Object.entries(tasks)
    .filter(([, t]) => t.activeModules.includes(modId))
    .map(([key, t]) => ({ key, name: t.name }));

  const card = document.getElementById('infoCard');
  card.innerHTML = `
    <div class="info-flow">
      <h3 style="color:${detail.color}">Brain Region</h3>
      <div class="info-region-header">
        <span class="info-region-dot" style="background:${detail.color}; --dot-color:${detail.color}"></span>
        <div class="info-region-title">${detail.title}</div>
      </div>
      <div class="info-region-anatomy">${detail.anatomy}</div>
      <div class="info-region-desc">${detail.desc}</div>
    </div>
    <div>
      <div class="info-clinical">
        <h4>Clinical Significance</h4>
        <div class="info-region-desc" style="font-size:12px">${detail.clinical}</div>
      </div>
      <div class="info-tasks-used" style="margin-top:var(--space-5)">
        <h4>Active In Tasks</h4>
        ${tasksUsing.map(t => `<span class="task-tag" data-task="${t.key}">${t.name}</span>`).join('')}
      </div>
    </div>
  `;

  // Make task tags clickable → switch to that task
  card.querySelectorAll('.task-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      clearBrainRegionSelection();
      activateTask(tag.dataset.task);
    });
  });

  card.classList.remove('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
}

function clearBrainRegionSelection() {
  selectedBrainRegion = null;
  document.querySelectorAll('.module').forEach(m => {
    m.classList.remove('active', 'dimmed', 'expanded');
  });
  document.querySelectorAll('#connections path').forEach(p => {
    p.style.stroke = '';
    p.style.opacity = '';
    p.style.strokeWidth = '';
  });
  updateBrainHighlights([]);
  document.getElementById('infoCard').classList.remove('visible');
}

// Click brain background to deselect
document.getElementById('brainSvg').addEventListener('click', (e) => {
  if (!e.target.closest('.brain-region') && selectedBrainRegion) {
    clearBrainRegionSelection();
  }
});

function updateBrainHighlights(activeModuleIds) {
  document.querySelectorAll('.brain-region').forEach(region => {
    const modId = region.dataset.modules;
    const isLit = activeModuleIds.includes(modId);
    region.classList.toggle('region-lit', isLit);
    if (isLit) {
      region.setAttribute('fill-opacity', '0.35');
    } else {
      const isDeep = modId === 'emotional' || modId === 'memory';
      region.setAttribute('fill-opacity', isDeep ? '0.06' : '0.12');
    }
  });
  // Light up white matter pathways when both ends are active
  document.querySelectorAll('.brain-flow-path').forEach(path => {
    const from = path.dataset.from;
    const to = path.dataset.to;
    const isLit = activeModuleIds.includes(from) && activeModuleIds.includes(to);
    path.classList.toggle('flow-lit', isLit);
  });
  // Update legend
  document.querySelectorAll('.brain-legend-item').forEach(item => {
    item.classList.toggle('active', activeModuleIds.includes(item.dataset.module));
  });
}

// ══════════════════════════════════════════════════
// BRAIN PARTICLE SYSTEM
// ══════════════════════════════════════════════════

const brainCanvas = document.getElementById('brainParticleCanvas');
const brainCtx = brainCanvas.getContext('2d');
let brainParticles = [];
let brainEmitters = [];
let brainParticleRunning = false;
let brainLastFrame = 0;
const BRAIN_MAX_PARTICLES = 30;
const brainSampledPaths = new Map();
const brainSvgEl = document.getElementById('brainSvg');

function resizeBrainCanvas() {
  const wrap = brainCanvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  brainCanvas.width = rect.width * dpr;
  brainCanvas.height = rect.height * dpr;
  brainCanvas.style.width = rect.width + 'px';
  brainCanvas.style.height = rect.height + 'px';
  brainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeBrainCanvas();
window.addEventListener('resize', () => setTimeout(resizeBrainCanvas, 200));

// Convert SVG viewBox coords to canvas pixel coords
function svgToCanvas(svgX, svgY) {
  const wrap = brainCanvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  // SVG viewBox is 0 0 400 300
  return {
    x: (svgX / 400) * rect.width,
    y: (svgY / 300) * rect.height
  };
}

function presampleBrainPath(pathEl, key) {
  const len = pathEl.getTotalLength();
  const numSamples = 60;
  const points = [];
  for (let i = 0; i <= numSamples; i++) {
    const svgPt = pathEl.getPointAtLength((i / numSamples) * len);
    const canvasPt = svgToCanvas(svgPt.x, svgPt.y);
    points.push(canvasPt);
  }
  brainSampledPaths.set(key, { points, length: len });
}

function getBrainPointOnPath(key, progress) {
  const data = brainSampledPaths.get(key);
  if (!data) return null;
  const t = Math.max(0, Math.min(1, progress / data.length));
  const idx = t * (data.points.length - 1);
  const i = Math.floor(idx);
  const frac = idx - i;
  const p0 = data.points[Math.min(i, data.points.length - 1)];
  const p1 = data.points[Math.min(i + 1, data.points.length - 1)];
  return { x: p0.x + (p1.x - p0.x) * frac, y: p0.y + (p1.y - p0.y) * frac };
}

function brainParticleLoop(ts) {
  if (!brainParticleRunning) return;
  const dt = Math.min(ts - brainLastFrame, 33);
  brainLastFrame = ts;

  const w = brainCanvas.width / (window.devicePixelRatio || 1);
  const h = brainCanvas.height / (window.devicePixelRatio || 1);
  brainCtx.clearRect(0, 0, w, h);

  // Update emitters
  for (const em of brainEmitters) {
    em.elapsed += dt;
    if (em.elapsed < em.delay) continue;
    em.timeSinceLast += dt;
    const interval = 1000 / em.rate;
    while (em.timeSinceLast >= interval && brainParticles.length < BRAIN_MAX_PARTICLES) {
      const data = brainSampledPaths.get(em.pathKey);
      if (data) {
        brainParticles.push({
          pathKey: em.pathKey,
          color: em.color,
          progress: 0,
          speed: 0.8 + Math.random() * 0.6,
          radius: 2 + Math.random() * 1.2,
          alive: true,
          trail: [],
          trailMax: 5,
          length: data.length
        });
      }
      em.timeSinceLast -= interval;
    }
  }

  // Update + render particles
  for (const p of brainParticles) {
    p.progress += p.speed * (dt / 16.67);
    const pt = getBrainPointOnPath(p.pathKey, p.progress);
    if (!pt) { p.alive = false; continue; }

    p.trail.push({ x: pt.x, y: pt.y });
    if (p.trail.length > p.trailMax) p.trail.shift();

    if (p.progress >= p.length) p.alive = false;

    // Draw trail
    for (let i = 0; i < p.trail.length - 1; i++) {
      const alpha = (i / p.trail.length) * 0.2;
      brainCtx.beginPath();
      brainCtx.arc(p.trail[i].x, p.trail[i].y, p.radius * 0.4, 0, Math.PI * 2);
      brainCtx.fillStyle = colorAlpha(p.color, alpha);
      brainCtx.fill();
    }

    // Glow
    const head = p.trail[p.trail.length - 1];
    if (head) {
      brainCtx.beginPath();
      brainCtx.arc(head.x, head.y, p.radius + 2.5, 0, Math.PI * 2);
      brainCtx.fillStyle = colorAlpha(p.color, 0.1);
      brainCtx.fill();

      brainCtx.beginPath();
      brainCtx.arc(head.x, head.y, p.radius, 0, Math.PI * 2);
      brainCtx.fillStyle = colorAlpha(p.color, 0.8);
      brainCtx.fill();
    }
  }

  brainParticles = brainParticles.filter(p => p.alive);
  requestAnimationFrame(brainParticleLoop);
}

function startBrainParticles(activeModuleIds) {
  if (prefersReducedMotion) return;
  stopBrainParticles();
  resizeBrainCanvas();
  brainSampledPaths.clear();
  brainEmitters = [];

  // Pre-sample all flow paths and create emitters for lit ones
  document.querySelectorAll('.brain-flow-path').forEach(path => {
    const from = path.dataset.from;
    const to = path.dataset.to;
    const key = path.id;
    presampleBrainPath(path, key);

    if (activeModuleIds.includes(from) && activeModuleIds.includes(to)) {
      // Get color from the path's stroke
      const color = path.getAttribute('stroke');
      brainEmitters.push({
        pathKey: key,
        color: color,
        rate: 1.5,
        delay: 0,
        elapsed: 0,
        timeSinceLast: 800 // emit quickly at start
      });
    }
  });

  if (brainEmitters.length > 0) {
    brainParticleRunning = true;
    brainLastFrame = performance.now();
    requestAnimationFrame(brainParticleLoop);
  }
}

function stopBrainParticles() {
  brainParticleRunning = false;
  brainParticles = [];
  brainEmitters = [];
  brainSampledPaths.clear();
  const w = brainCanvas.width / (window.devicePixelRatio || 1);
  const h = brainCanvas.height / (window.devicePixelRatio || 1);
  brainCtx.clearRect(0, 0, w, h);
}

// Hook updateBrainHighlights to also manage brain particles
const _origUpdateBrain = updateBrainHighlights;
updateBrainHighlights = function(activeModuleIds) {
  _origUpdateBrain(activeModuleIds);
  if (activeModuleIds.length > 0 && activeTask) {
    // Restart particles with new set of active modules
    startBrainParticles(activeModuleIds);
  } else if (activeModuleIds.length === 0) {
    stopBrainParticles();
  }
};

// Hook into cascade activation — update brain when modules light up
const _origApplyCascade = applyCascade;
applyCascade = function(taskKey) {
  _origApplyCascade(taskKey);
  // Progressively light up brain regions with cascade
  const task = tasks[taskKey];
  const sequenced = Object.entries(task.sequence).sort(([, a], [, b]) => a - b);
  const cascadeDelay = 350;
  let litModules = [];
  sequenced.forEach(([modKey], index) => {
    const timer = setTimeout(() => {
      litModules.push(modKey);
      updateBrainHighlights([...litModules]);
    }, index * cascadeDelay);
    cascadeTimers.push(timer);
  });
};

// Pause brain particles when tab hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden && brainParticleRunning) {
    brainParticleRunning = false;
  } else if (!document.hidden && activeTask && brainEmitters.length > 0) {
    brainParticleRunning = true;
    brainLastFrame = performance.now();
    requestAnimationFrame(brainParticleLoop);
  }
});
</script>
